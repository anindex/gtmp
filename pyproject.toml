[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
version = "0.2.0"

name = "gtmp"
dependencies = [
  "jax>=0.5.0",
  "equinox>=0.11.0",
  "jaxlie>=1.3.0",
  "ott-jax>=0.4.0",
  "kinax",
  "matplotlib",
  "tqdm",
  "hydra-core",
  "pybullet",
  "seaborn",
  "xmltodict",
  "pyyaml",
]
requires-python = ">= 3.11"

authors = [
  {name = "An T. Le", email = "an.thai.le97@gmail.com"},
]
description = "Global Tensor Motion Planning (GTMP) - massively parallelized motion planning in JAX."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["Motion Planning", "Tensor", "URDF", "JAX", "Vectorization", "Robotics"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["gtmp", "gtmp.*"]
exclude = []

[project.urls]
Homepage = "https://sites.google.com/view/gtmp/home"
Repository = "https://github.com/anindex/gtmp"
Paper = "https://arxiv.org/abs/2411.19393"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
